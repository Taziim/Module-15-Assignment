name: Policy Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  policy-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Evaluate Docker tag policy
        run: |
          echo '{"image": {"name": "cicd-demo", "tag": "latest"}}' |
            opa eval --stdin-input \
              --data policy/docker.rego \
              "data.docker.deny"