name: Trivy Security Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cicd-quality-app:1.0 .

      # ==========================================
      # Scan Docker image
      # ==========================================
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cicd-quality-app:1.0"
          format: "json"
          output: "trivy-image-report.json"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: false
          exit-code: "0"

      # ==========================================
      # Display vulnerability report
      # ==========================================
      - name: Display Trivy report
        run: |
          cat trivy-image-report.json

      # ==========================================
      # Upload report to GitHub Actions
      # ==========================================
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-image-report.json
