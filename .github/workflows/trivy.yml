name: Trivy Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:  
  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-sonar
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t cicd-quality-app:1.0 .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cicd-quality-app:1.0 '
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'