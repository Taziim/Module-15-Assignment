name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # =====================================================
  # JOB 1: TEST
  # =====================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm i

      # Run Jest tests with coverage
      - name: Run tests with coverage
        run: npm test -- --coverage


  # =====================================================
  # JOB 2: SONARQUBE
  # =====================================================
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    # SonarQube runs only when test job succeeds
    needs: test

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm i

      # Generate coverage report
      - name: Run tests with coverage
        run: npm test -- --coverage

      # SonarQube analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=taziim_cicd-quality-assignment
            -Dsonar.organization=taziim
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**
            -Dsonar.exclusions=**/node_modules/**

  # =====================================================
  # JOB 3: Trivy
  # =====================================================
jobs:  
  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-sonar
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t cicd-quality-app:1.0 .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cicd-quality-app:1.0 '
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
